$kind: http-request
url: "{{baseUrl}}/usuarios/{{adminId}}"
method: PUT
headers:
  Content-Type: application/json
  X-Usuario-Id: "{{adminId}}"
body:
  type: json
  content: |-
    {
      "nombre": "Ana",
      "apellido": "Admin",
      "rol": "OPERARIO"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 400", function () { pm.response.to.have.status(400); });
      pm.test("Mensaje contiene: propio rol", function () { pm.expect(pm.response.json().mensaje).to.include("propio rol"); });
    language: text/javascript
order: 12000
