$kind: http-request
url: "{{baseUrl}}/usuarios"
method: POST
headers:
  Content-Type: application/json
  X-Usuario-Id: "{{adminId}}"
body:
  type: json
  content: |-
    {
      "nombre": "Otra",
      "apellido": "Persona",
      "username": "lgomez",
      "password": "clave1234",
      "rol": "OPERARIO"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 400", function () { pm.response.to.have.status(400); });
      pm.test("Mensaje contiene: ya existe", function () { pm.expect(pm.response.json().mensaje).to.include("ya existe"); });
    language: text/javascript
order: 2000
