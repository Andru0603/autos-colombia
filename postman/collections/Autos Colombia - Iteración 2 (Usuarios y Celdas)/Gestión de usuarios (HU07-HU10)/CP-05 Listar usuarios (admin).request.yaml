$kind: http-request
url: "{{baseUrl}}/usuarios"
method: GET
headers:
  Content-Type: application/json
  X-Usuario-Id: "{{adminId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Es una lista sin contraseñas", function () { const l = pm.response.json(); pm.expect(l).to.be.an("array"); l.forEach(u => pm.expect(u).to.not.have.property("passwordHash")); });
    language: text/javascript
order: 7000
