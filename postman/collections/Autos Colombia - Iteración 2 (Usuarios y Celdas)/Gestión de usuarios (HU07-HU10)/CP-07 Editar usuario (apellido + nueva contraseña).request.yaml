$kind: http-request
url: "{{baseUrl}}/usuarios/{{nuevoUsuarioId}}"
method: PUT
headers:
  Content-Type: application/json
  X-Usuario-Id: "{{adminId}}"
body:
  type: json
  content: |-
    {
      "nombre": "Laura",
      "apellido": "Gómez Ruiz",
      "rol": "OPERARIO",
      "password": "nuevaClave99"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Apellido actualizado", function () { pm.expect(pm.response.json().apellido).to.eql("Gómez Ruiz"); });
    language: text/javascript
order: 10000
