$kind: http-request
url: "{{baseUrl}}/usuarios/{{nuevoUsuarioId}}/estado"
method: PUT
headers:
  Content-Type: application/json
  X-Usuario-Id: "{{adminId}}"
body:
  type: json
  content: |-
    {
      "activo": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Quedó inactivo", function () { pm.expect(pm.response.json().activo).to.eql(false); });
    language: text/javascript
order: 13000
