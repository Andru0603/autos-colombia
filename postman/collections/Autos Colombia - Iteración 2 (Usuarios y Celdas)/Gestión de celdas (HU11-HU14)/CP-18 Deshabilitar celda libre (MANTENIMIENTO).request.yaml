$kind: http-request
url: "{{baseUrl}}/celdas/{{nuevaCeldaId}}/estado"
method: PUT
headers:
  Content-Type: application/json
  X-Usuario-Id: "{{adminId}}"
body:
  type: json
  content: |-
    {
      "estado": "MANTENIMIENTO"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Quedó en MANTENIMIENTO", function () { pm.expect(pm.response.json().estado).to.eql("MANTENIMIENTO"); });
    language: text/javascript
order: 9000
