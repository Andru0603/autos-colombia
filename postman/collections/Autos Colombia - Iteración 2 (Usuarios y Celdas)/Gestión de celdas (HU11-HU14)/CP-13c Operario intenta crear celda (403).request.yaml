$kind: http-request
url: "{{baseUrl}}/celdas"
method: POST
headers:
  Content-Type: application/json
  X-Usuario-Id: "{{operarioId}}"
body:
  type: json
  content: |-
    {
      "numero": "Z-98",
      "tipo": "CARRO"
    }
scripts:
  - type: afterResponse
    code: pm.test("Código HTTP 403", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 4000
