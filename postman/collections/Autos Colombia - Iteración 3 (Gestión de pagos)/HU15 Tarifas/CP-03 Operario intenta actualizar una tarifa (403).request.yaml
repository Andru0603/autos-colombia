$kind: http-request
url: "{{baseUrl}}/tarifas/CARRO"
method: PUT
headers:
  Content-Type: application/json
  X-Usuario-Id: "{{operarioId}}"
body:
  type: json
  content: |-
    {
      "valorMensual": 99999
    }
scripts:
  - type: afterResponse
    code: pm.test("Código HTTP 403", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 4000
