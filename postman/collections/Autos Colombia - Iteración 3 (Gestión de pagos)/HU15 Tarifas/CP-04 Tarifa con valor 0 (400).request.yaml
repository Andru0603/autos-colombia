$kind: http-request
url: "{{baseUrl}}/tarifas/CARRO"
method: PUT
headers:
  Content-Type: application/json
  X-Usuario-Id: "{{adminId}}"
body:
  type: json
  content: |-
    {
      "valorMensual": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 400", function () { pm.response.to.have.status(400); });
      pm.test("Mensaje contiene: mayor que 0", function () { pm.expect(pm.response.json().mensaje).to.include("mayor que 0"); });
    language: text/javascript
order: 5000
