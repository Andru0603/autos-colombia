$kind: http-request
url: "{{baseUrl}}/pagos"
method: POST
headers:
  Content-Type: application/json
  X-Usuario-Id: "{{operarioId}}"
body:
  type: json
  content: |-
    {
      "documento": "2020202020",
      "meses": 1,
      "metodoPago": "TRANSFERENCIA"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      const j = pm.response.json();
      pm.collectionVariables.set("pagoMariaId", j.idPago);
      pm.test("Monto 150000", function () { pm.expect(Number(j.monto)).to.eql(150000); });
    language: text/javascript
order: 3000
